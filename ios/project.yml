name: MacroBar

options:
  bundleIdPrefix: com.antoniovalenzuela
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  MacroBar:
    type: application
    platform: iOS
    sources:
      - path: MacroBar
      - path: Shared
    dependencies:
      - target: MacroBarWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoniovalenzuela.macrobar
        INFOPLIST_KEY_CFBundleDisplayName: MacroBar
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: MacroBar/MacroBar.entitlements

  MacroBarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MacroBarWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoniovalenzuela.macrobar.widget
        INFOPLIST_FILE: MacroBarWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacroBarWidget/MacroBarWidget.entitlements
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  MacroBar:
    build:
      targets:
        MacroBar: all
        MacroBarWidget: all
